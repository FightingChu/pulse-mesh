replicaCount: 2

image:
  repository: pulse-mesh/cloud
  tag: "0.1.0"
  pullPolicy: IfNotPresent

ai:
  replicaCount: 1
  image:
    repository: pulse-mesh/ai
    tag: "0.1.0"
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
