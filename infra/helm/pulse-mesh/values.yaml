replicaCount: 1

image:
  repository: pulse-mesh/cloud
  tag: "0.1.0"
  pullPolicy: IfNotPresent

ai:
  replicaCount: 1
  maxWorkers: 8
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  image:
    repository: pulse-mesh/ai
    tag: "0.1.0"
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
