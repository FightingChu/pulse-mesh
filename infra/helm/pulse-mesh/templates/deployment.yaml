apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cloud
  labels:
    app: {{ .Release.Name }}-cloud
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-cloud
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-cloud
    spec:
      containers:
        - name: cloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PULSE_AI_URL
              value: "http://{{ .Release.Name }}-ai:8000"
            - name: PULSE_DATA_DIR
              value: /var/lib/pulse-mesh
          volumeMounts:
            - name: pulse-data
              mountPath: /var/lib/pulse-mesh
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.targetPort }}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: pulse-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-cloud-data
