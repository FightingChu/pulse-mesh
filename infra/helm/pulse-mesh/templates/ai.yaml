apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ai
  labels:
    app: {{ .Release.Name }}-ai
spec:
  replicas: {{ .Values.ai.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-ai
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ai
    spec:
      containers:
        - name: ai
          image: "{{ .Values.ai.image.repository }}:{{ .Values.ai.image.tag }}"
          imagePullPolicy: {{ .Values.ai.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: PULSE_AI_MAX_WORKERS
              value: {{ .Values.ai.maxWorkers | quote }}
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 12
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ai.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ai
spec:
  selector:
    app: {{ .Release.Name }}-ai
  ports:
    - port: 8000
      targetPort: 8000
