apiVersion: apps/v1
kind: Deployment
metadata: {name: pulse-cloud}
spec:
  replicas: 2
  selector: {matchLabels: {app: pulse-cloud}}
  template:
    metadata: {labels: {app: pulse-cloud}}
    spec:
      containers:
      - name: cloud
        image: pulse-mesh/cloud:0.1.0
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /health, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: pulse-cloud}
spec:
  selector: {app: pulse-cloud}
  ports: [{port: 80, targetPort: 8080}]
