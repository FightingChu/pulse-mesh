apiVersion: apps/v1
kind: Deployment
metadata: {name: pulse-cloud}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: pulse-cloud}}
  template:
    metadata: {labels: {app: pulse-cloud}}
    spec:
      containers:
      - name: cloud
        image: pulse-mesh/cloud:0.1.0
        ports: [{containerPort: 8080}]
        env:
        - name: PULSE_AI_URL
          value: http://pulse-ai:8000
        - name: PULSE_DATA_DIR
          value: /var/lib/pulse-mesh
        volumeMounts:
        - name: pulse-data
          mountPath: /var/lib/pulse-mesh
        readinessProbe: {httpGet: {path: /health/ready, port: 8080}}
        livenessProbe: {httpGet: {path: /health/live, port: 8080}}
      volumes:
      - name: pulse-data
        persistentVolumeClaim: {claimName: pulse-cloud-data}
---
apiVersion: v1
kind: Service
metadata: {name: pulse-cloud}
spec:
  selector: {app: pulse-cloud}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pulse-ai}
spec:
  replicas: 1
  selector: {matchLabels: {app: pulse-ai}}
  template:
    metadata: {labels: {app: pulse-ai}}
    spec:
      containers:
      - name: ai
        image: pulse-mesh/ai:0.1.0
        ports: [{containerPort: 8000}]
        readinessProbe: {httpGet: {path: /health/live, port: 8000}}
---
apiVersion: v1
kind: Service
metadata: {name: pulse-ai}
spec:
  selector: {app: pulse-ai}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pulse-cloud-data}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
